project:
  type: book
  output-dir: _book

lang: es

website:
  site-url: https://codernarvaez.github.io/estructuradedatosunl/
  repo-url: https://github.com/codernarvaez/estructuradedatosunl
  repo-actions: [source, issue]

execute:
  cache: false
  freeze: false
  daemon: false

knitr:
  opts_chunk:
    python.reticulate: false
book:
  title: "Estructura de Datos"
  author: "Cristian Narváez Guillén"
  date: "mar-ago 2026"

  sidebar:
    logo: images/logo-unl.png

  downloads: [pdf]

  chapters:
    - index.qmd
    - summary.qmd
    - intro.qmd
    - 01-estructuras-estaticas.qmd
    - 02-estructuras-dinamicas.qmd
    - 03-algoritmos-ordenacion.qmd
    - 04-algoritmos-busqueda.qmd
    - 05-grafos-arboles.qmd
    - 06-estructuras-avanzadas.qmd
    - 07-ArbolesBinarios.qmd
    - 07-arboles_B_R.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
    css:
      - styles.css  

  pdf:
    documentclass: scrreprt
    latex-auto-install: true
    include-in-header:
      text: |
        \usepackage{ragged2e}
        \justifying
